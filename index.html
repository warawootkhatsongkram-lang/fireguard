<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FireGuard · ระบบบันทึกถังดับเพลิง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FireGuard — ธีม Deep Navy + Oxblood (กรมท่า / แดงเลือดหมู / ขาว)
   ลำดับ: variables → base → layout → components → utilities → media
   หมายเหตุ: ตัวแปรยังชื่อ --gold/--gold2 เหมือนเดิม (ใช้อยู่ ~30 จุดทั่วไฟล์ ไม่เปลี่ยนชื่อ
   เพื่อไม่ให้กลายเป็น refactor) แต่ค่าข้างในเปลี่ยนเป็นแดงเลือดหมูแล้ว:
     --gold  = แดงเลือดหมูเข้ม ใช้เป็น "พื้น/ขอบ" (เข้มเกินกว่าจะใช้เป็นตัวหนังสือบนพื้นมืด)
     --gold2 = โทนสว่างของแดงเลือดหมู ใช้เป็น "ตัวหนังสือ/เส้นเน้น" (คอนทราสต์ผ่าน 4.5:1)
   ============================================================ */
:root{
  --bg:#0e1626; --bg2:#16243a;
  --card:rgba(190,214,255,.055); --card2:rgba(190,214,255,.10);
  --line:rgba(190,214,255,.13); --line2:rgba(190,214,255,.24);
  --txt:#f1f5fb; --muted:#a2b3cc;
  --gold:#8c1c24; --gold2:#e9a8ad; --gold-dim:rgba(140,28,36,.22);
  --red:#ef4444; --red-dim:rgba(239,68,68,.15);
  --green:#22c55e; --green-dim:rgba(34,197,94,.15);
  --amber:#f59e0b; --amber-dim:rgba(245,158,11,.15);
  --cyan:#22d3ee;
  --r:14px; --r2:10px;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  background:
    radial-gradient(1100px 600px at 10% -10%, rgba(140,28,36,.30), transparent 60%),
    radial-gradient(900px 500px at 108% 4%, rgba(35,66,110,.42), transparent 58%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt); font-family:'Sarabun',system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
input,select,textarea,button{font-family:inherit; font-size:16px}

/* ---------- หมอกควันลอย (แบ็คกราวด์) ----------
   2 ชั้นซ้อนกัน ลอยคนละทิศคนละความเร็ว จะได้ไม่เห็นเป็นจังหวะซ้ำ
   ทำด้วย radial-gradient ล้วน ไม่มีรูป ไม่มี CDN · fixed + pointer-events:none
   จึงไม่บังการกดและไม่เลื่อนตามเนื้อหา · z-index:-1 อยู่ใต้ทุกอย่าง */
.smoke{position:fixed; inset:-25% -25% -25% -25%; z-index:-1; pointer-events:none; overflow:hidden}
.smoke i{
  position:absolute; inset:0; display:block;
  background:
    radial-gradient(38% 26% at 18% 32%, rgba(236,241,250,.30), transparent 68%),
    radial-gradient(30% 22% at 62% 18%, rgba(236,241,250,.24), transparent 66%),
    radial-gradient(44% 30% at 82% 62%, rgba(228,234,246,.26), transparent 70%),
    radial-gradient(26% 20% at 40% 78%, rgba(228,234,246,.21), transparent 66%);
  filter:blur(30px);
  animation:drift1 34s ease-in-out infinite alternate;
  will-change:transform,opacity;
}
.smoke i+i{
  background:
    radial-gradient(34% 24% at 72% 28%, rgba(255,238,238,.24), transparent 68%),
    radial-gradient(46% 32% at 26% 68%, rgba(242,246,254,.22), transparent 70%),
    radial-gradient(28% 20% at 52% 44%, rgba(255,242,242,.19), transparent 64%);
  filter:blur(42px);
  animation:drift2 47s ease-in-out infinite alternate;
}
/* ขยับไกลพอให้ตาจับได้ + หายใจเข้าออก (opacity) ให้เหมือนควันจริงที่หนาบางไม่เท่ากัน */
@keyframes drift1{
  from{transform:translate3d(-13%,7%,0)  scale(1.05); opacity:.55}
  50% {transform:translate3d(9%,-9%,0)   scale(1.24); opacity:.95}
  to  {transform:translate3d(15%,10%,0)  scale(1.08); opacity:.62}
}
@keyframes drift2{
  from{transform:translate3d(12%,-8%,0)  scale(1.20); opacity:.42}
  50% {transform:translate3d(-10%,10%,0) scale(1.02); opacity:.80}
  to  {transform:translate3d(-16%,-9%,0) scale(1.26); opacity:.50}
}
/* เครื่องที่ตั้งค่าลดการเคลื่อนไหว (หรือคนเมารถ) → หมอกหยุดนิ่ง แต่ยังเห็นเป็นพื้นหลัง */
@media (prefers-reduced-motion:reduce){
  .smoke i{animation:none; opacity:.6}      /* ต้องกำหนด opacity เอง เพราะไม่ได้ค่าจาก keyframe แล้ว */
  .smoke i+i{opacity:.45}
}

/* ---------- layout ---------- */
.wrap{max-width:1000px; margin:0 auto; padding:0 14px}
header.top{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(14,22,38,.95),rgba(14,22,38,.82));
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1000px; margin:0 auto; padding:11px 14px; display:flex; align-items:center; gap:10px}
.logo{font-size:19px; font-weight:700; letter-spacing:.02em; display:flex; align-items:center; gap:10px; min-width:0}
.logo em{font-style:normal; background:linear-gradient(92deg,var(--gold2),#fff); -webkit-background-clip:text; background-clip:text; color:transparent}
/* โลโก้บริษัทมีตัวหนังสือสีดำอยู่ในรูป จึงต้องวางบนแผ่นขาวถึงจะอ่านออกบนพื้นกรม */
.logo img{height:38px; width:auto; display:block; background:#fff; border-radius:8px; padding:4px 7px; flex:0 0 auto}
.logo .brand{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.logo .tagline{font-size:11px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; color:var(--gold2); opacity:.9}
.site{font-size:13px; color:var(--muted); margin-left:auto; text-align:right; line-height:1.35; min-width:0}
.site .co{display:block; font-size:14px; font-weight:700; letter-spacing:.01em; color:#fff; text-shadow:0 1px 10px rgba(140,28,36,.75)}
@media(max-width:620px){
  .logo{font-size:17px; gap:8px}
  .logo img{height:32px}
  .logo .tagline{display:none}          /* จอแคบ: ตัดทางไลน์ทิ้ง ให้ชื่อบริษัทได้ที่ */
  .site{font-size:11.5px}
  .site .co{font-size:12.5px}
}

nav.tabs{display:flex; gap:6px; padding:8px 0 2px; overflow-x:auto; -webkit-overflow-scrolling:touch}
nav.tabs button{
  flex:0 0 auto; min-height:44px; padding:8px 16px; border-radius:999px; cursor:pointer;
  background:var(--card); border:1px solid var(--line); color:var(--muted);
  transition:.15s; white-space:nowrap;
}
nav.tabs button:hover{border-color:var(--line2); color:var(--txt)}
nav.tabs button.on{background:var(--gold-dim); border-color:rgba(200,60,72,.55); color:var(--gold2); font-weight:600}

/* ---------- components ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0; backdrop-filter:blur(10px)}
h1,h2,h3{line-height:1.35}
h2.sec{font-size:19px; margin:20px 0 10px; padding-left:12px; position:relative}
h2.sec::before{content:''; position:absolute; left:0; top:.3em; bottom:.3em; width:4px; border-radius:3px; background:linear-gradient(180deg,var(--gold2),var(--gold))}
h3{font-size:16.5px; margin:16px 0 8px; color:var(--gold2)}

.btn{
  min-height:44px; padding:10px 16px; border-radius:var(--r2); cursor:pointer;
  background:var(--card2); border:1px solid var(--line2); color:var(--txt);
  transition:.15s; display:inline-flex; align-items:center; justify-content:center; gap:7px;
}
.btn:hover{border-color:var(--gold2); color:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#a8232d,var(--gold)); border-color:#a8232d; color:#fff; font-weight:700}
.btn.primary:hover{filter:brightness(1.14); color:#fff}
.btn.danger{border-color:rgba(239,68,68,.5); color:#fca5a5}
.btn.danger:hover{background:var(--red-dim); border-color:var(--red); color:#fff}
.btn.sm{min-height:38px; padding:6px 12px; font-size:14.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.right{margin-left:auto}

label.f{display:block; margin:11px 0 5px; font-size:14.5px; color:var(--muted)}
label.f b{color:#fca5a5; font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%; min-height:44px; padding:9px 12px; border-radius:var(--r2);
  background:rgba(0,0,0,.28); border:1px solid var(--line); color:var(--txt); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold2); box-shadow:0 0 0 3px rgba(233,168,173,.20); background:rgba(3,10,22,.5)}
textarea{min-height:76px; resize:vertical; line-height:1.55}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.hint{font-size:13.5px; color:var(--muted); margin:4px 0 0}
.err{color:#fca5a5; font-size:14px; margin:8px 0 0}

/* pill / status */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:13px; padding:3px 10px; border-radius:999px; border:1px solid var(--line2); color:var(--muted); white-space:nowrap}
.pill.ok{background:var(--green-dim); border-color:rgba(34,197,94,.4); color:#86efac}
.pill.soon{background:var(--amber-dim); border-color:rgba(245,158,11,.45); color:#fcd34d}
.pill.over{background:var(--red-dim); border-color:rgba(239,68,68,.45); color:#fca5a5}
.pill.none{background:rgba(255,255,255,.05)}
.pill.gold{background:var(--gold-dim); border-color:rgba(200,60,72,.5); color:var(--gold2)}

/* stat */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:10px; margin:12px 0}
.stat{background:linear-gradient(158deg,rgba(140,28,36,.30),rgba(35,66,110,.34)); border:1px solid var(--line); border-radius:var(--r2); padding:12px; text-align:center}
.stat .n{font-size:24px; font-weight:700; line-height:1.2}
.stat .l{font-size:13px; color:var(--muted)}
.stat.over .n{color:#fca5a5} .stat.soon .n{color:#fcd34d} .stat.ok .n{color:#86efac}
.stat.clickable{cursor:pointer; transition:.15s}
.stat.clickable:hover{border-color:var(--gold2)}

/* list item */
.fe{
  display:flex; gap:12px; align-items:center; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r2);
  padding:12px 14px; margin:8px 0; color:var(--txt); transition:.15s;
}
.fe:hover{border-color:rgba(233,168,173,.5); background:var(--card2)}
.fe .code{font-weight:700; font-size:16.5px; letter-spacing:.02em}
.fe .loc{font-size:13.5px; color:var(--muted); margin-top:2px}
.fe .mid{min-width:0; flex:1}
.fe .side{text-align:right; flex:0 0 auto; display:flex; flex-direction:column; gap:5px; align-items:flex-end}
.dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
.dot.ok{background:var(--green)} .dot.soon{background:var(--amber)} .dot.over{background:var(--red)} .dot.none{background:var(--muted)}

/* checklist */
.chk{background:var(--card); border:1px solid var(--line); border-radius:var(--r2); padding:12px 14px; margin:9px 0}
.chk .q{font-size:15.5px; margin-bottom:9px; display:flex; gap:8px}
.chk .q .no{color:var(--gold2); font-weight:700; flex:0 0 auto}
.opts{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px}
.opts label{
  min-height:44px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
  border:1px solid var(--line); border-radius:var(--r2); background:rgba(0,0,0,.25);
  font-size:14.5px; color:var(--muted); transition:.12s; user-select:none;
}
.opts input{display:none}
.opts label:hover{border-color:var(--line2)}
.opts input:checked+span{color:#fff}
.opts label.p input:checked~span{color:#86efac}
.opts label.p:has(input:checked){background:var(--green-dim); border-color:var(--green)}
.opts label.f:has(input:checked){background:var(--red-dim); border-color:var(--red)}
.opts label.n:has(input:checked){background:var(--card2); border-color:var(--line2)}
.chk textarea{margin-top:8px; min-height:44px}

/* table */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--r2); margin:10px 0}
table{border-collapse:collapse; width:100%; min-width:460px; font-size:14.5px}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line)}
th{background:rgba(140,28,36,.34); color:var(--gold2); font-weight:600; white-space:nowrap}
tr:last-child td{border-bottom:none}

/* modal */
.mask{position:fixed; inset:0; background:rgba(0,0,0,.66); backdrop-filter:blur(3px); z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto}
.modal{background:linear-gradient(180deg,#1a2740,#101a2c); border:1px solid var(--line2); border-radius:var(--r); width:100%; max-width:620px; padding:18px; margin:auto 0; box-shadow:0 20px 60px rgba(0,0,0,.55)}
.modal h3{margin:0 0 4px; color:#fff; font-size:19px}
.modal .foot{display:flex; gap:9px; margin-top:18px}
.modal .foot .btn{flex:1}

/* toast */
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:120; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{background:#16243a; border:1px solid var(--line2); border-left:3px solid var(--gold2); border-radius:var(--r2); padding:11px 16px; font-size:15px; box-shadow:0 8px 30px rgba(0,0,0,.5); animation:pop .18s ease-out}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--green)}
@keyframes pop{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* empty */
.empty{text-align:center; padding:38px 16px; color:var(--muted)}
.empty .ic{font-size:44px; display:block; margin-bottom:10px; opacity:.75}

/* debug panel (?debug=1) */
#debug{display:none; position:fixed; right:10px; bottom:10px; z-index:200; width:min(340px,calc(100vw - 20px)); max-height:52vh; overflow:auto;
  background:rgba(6,8,12,.96); border:1px solid var(--cyan); border-radius:var(--r2); padding:11px 13px; font-size:12.5px; line-height:1.6; color:#cbd5e1}
#debug.on{display:block}
#debug h4{margin:0 0 6px; color:var(--cyan); font-size:13px; display:flex; align-items:center}
#debug pre{margin:4px 0 0; white-space:pre-wrap; word-break:break-word; font-size:12px; color:#94a3b8}
#debug .k{color:var(--gold2)}

/* ---------- Dashboard ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:12px 0}
.kpi{background:linear-gradient(158deg,rgba(140,28,36,.26),rgba(35,66,110,.30)); border:1px solid var(--line); border-radius:var(--r); padding:14px; text-align:center; backdrop-filter:blur(10px)}
.kpi .donut{display:flex; justify-content:center}
.kpi .cap{font-size:13.5px; color:var(--muted); margin-top:4px}
.barrow{display:flex; align-items:center; gap:10px; margin:7px 0; font-size:14.5px}
.barrow .b-label{flex:0 0 40%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.barrow .b-track{flex:1; height:12px; border-radius:999px; background:rgba(255,255,255,.07); overflow:hidden}
.barrow .b-track i{display:block; height:100%; border-radius:999px}
.barrow .b-n{flex:0 0 auto; min-width:28px; text-align:right; font-variant-numeric:tabular-nums}
.barrow .b-sub{flex:0 0 auto; font-size:12.5px; color:#fca5a5}

/* ---- กราฟบนหน้าภาพรวม ---- */
/* กราฟ 12 เดือนกว้างกว่าจอมือถือ ให้เลื่อนในกล่องตัวเอง หน้าเว็บทั้งหน้าจะได้ไม่เลื่อนออกข้าง */
.chartscroll{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px}
/* margin auto = กราฟที่แคบกว่ากรอบจะอยู่กึ่งกลาง (เดือนน้อยจะได้ไม่ชิดซ้ายโหว่ขวา)
   ส่วนกราฟที่กว้างกว่ากรอบ margin auto ไม่มีผล การเลื่อนแนวนอนยังทำงานเหมือนเดิม */
.chartscroll .chart{display:block; max-width:none; margin:0 auto}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; font-size:13.5px; color:var(--muted)}
.legend .lg{display:inline-flex; align-items:center; gap:6px}
.legend .lg i{width:12px; height:12px; border-radius:3px; flex:0 0 auto}
.legend .lg b{color:var(--txt); font-variant-numeric:tabular-nums}
.healthbar{display:flex; width:100%; height:30px; border-radius:8px; overflow:hidden; border:1px solid var(--line)}
.healthbar .hb{display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#0e1626; min-width:0; overflow:hidden; font-variant-numeric:tabular-nums}
.mono-note{font-size:13.5px; color:var(--muted); margin:9px 0 0}
.alert{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer; color:var(--txt);
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--muted);
  border-radius:var(--r2); padding:11px 13px; margin:7px 0; transition:.15s;
}
.alert:hover{border-color:rgba(233,168,173,.5); background:var(--card2)}
.alert.over{border-left-color:var(--red)}
.alert.soon{border-left-color:var(--amber)}
.alert.never{border-left-color:var(--cyan)}
.alert .a-ic{font-size:19px; flex:0 0 auto}
.alert .a-mid{flex:1; min-width:0}
.alert .a-code{font-weight:700}
.alert .a-txt{font-size:13.5px; color:var(--muted)}
.chips{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0}
.chip{padding:7px 13px; min-height:40px; display:inline-flex; align-items:center; border-radius:999px; cursor:pointer;
  background:var(--card); border:1px solid var(--line); color:var(--muted); font-size:14px}
.chip.on{background:var(--gold-dim); border-color:rgba(200,60,72,.55); color:var(--gold2); font-weight:600}
.tabbadge{display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; margin-left:6px;
  border-radius:999px; background:var(--red); color:#fff; font-size:12px; font-weight:700}

/* ---------- QR / แท็กติดถัง ---------- */
.qrbox{background:#fff; border-radius:10px; padding:10px; display:inline-block; line-height:0}
.qrbox svg{display:block; width:100%; height:auto}
.tag-grid{display:grid; gap:8px; margin:12px 0}
.tag-grid.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tag-grid.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tag{
  background:#fff; color:#111; border:1px solid #d5d5d5; border-radius:8px;
  padding:8px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.tag .qrbox{padding:0; width:100%; max-width:150px}
.tag .t-code{font-weight:700; font-size:15px; letter-spacing:.02em; line-height:1.25}
.tag .t-sub{font-size:11px; color:#444; line-height:1.35}
.tag .t-hint{font-size:9.5px; color:#666; border-top:1px dashed #bbb; padding-top:3px; width:100%; margin-top:2px}
.pickrow{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--r2); background:var(--card); margin:6px 0; cursor:pointer}
.pickrow input{width:22px; height:22px; flex:0 0 auto; accent-color:var(--gold)}

/* ---------- กล้องสแกน QR ---------- */
#scanWrap{position:relative; background:#000; border-radius:var(--r2); overflow:hidden; aspect-ratio:1/1; max-height:60vh; margin:10px 0}
#scanVideo{width:100%; height:100%; object-fit:cover; display:block}
.scan-frame{position:absolute; inset:16%; border:3px solid var(--gold2); border-radius:12px; box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}

/* ---------- รูปแนบ ---------- */
.thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.thumb{position:relative; width:82px; height:82px; border-radius:8px; overflow:hidden; border:1px solid var(--line2)}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb button{position:absolute; top:2px; right:2px; width:24px; height:24px; min-height:24px; padding:0; border-radius:50%;
  background:rgba(0,0,0,.7); border:1px solid var(--line2); color:#fca5a5; font-size:14px; line-height:1; cursor:pointer}
/* มุมล่างซ้ายของรูปที่ยังไม่ได้อัปขึ้น Drive — ยังอยู่แค่ในเครื่องนี้ */
.thumb .pendmark{position:absolute; left:2px; bottom:2px; padding:0 5px; border-radius:6px;
  background:rgba(0,0,0,.7); border:1px solid var(--line2); color:#fcd34d; font-size:12px; line-height:18px}

/* ---------- โหมดเดินตรวจ ---------- */
.progbar{height:9px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin:8px 0}
.progbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold2)); transition:width .25s}

/* ---------- พิมพ์แท็ก A4 ---------- */
@media print{
  @page{ size:A4; margin:8mm }
  body{background:#fff !important; color:#000; padding:0}
  header.top, nav.tabs, .noprint, #debug, #toast, .mask, .smoke{display:none !important}
  .wrap{max-width:none; padding:0}
  .tag-grid{gap:0; page-break-inside:auto}
  .tag-grid.g3{grid-template-columns:repeat(3,1fr)}
  .tag-grid.g2{grid-template-columns:repeat(2,1fr)}
  .tag{border:1px dashed #999; border-radius:0; page-break-inside:avoid; break-inside:avoid; height:69mm; justify-content:center}
  .tag-grid.g2 .tag{height:92mm}
  .tag .qrbox{max-width:38mm}
  .tag-grid.g2 .tag .qrbox{max-width:52mm}
  .printonly{display:block !important}
}
.printonly{display:none}

/* ---------- เฟส 5: รายงาน A4 ---------- */
.report{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin:12px 0}
/* หัวรายงาน: โลโก้ชิดซ้าย + ตัวถ่วงกว้างเท่ากันฝั่งขวา เพื่อให้ชื่อบริษัท/ชื่อรายงานยังอยู่กึ่งกลางหน้ากระดาษจริง */
.rep-head{display:flex; align-items:flex-start; gap:12px}
.rep-head .rep-head-txt{flex:1 1 auto; min-width:0}
.rep-logo{flex:0 0 auto; width:116px; height:auto; box-sizing:border-box; background:#fff; border-radius:6px; padding:4px 6px}
.rep-spacer{flex:0 0 116px}
@media (max-width:560px){                 /* จอแคบ: วางโลโก้ไว้กลางเหนือหัวเรื่อง แทนการบีบข้อความ */
  .rep-head{flex-direction:column; align-items:center; gap:8px}
  .rep-head .rep-head-txt{width:100%}
  .rep-spacer{display:none}
}
.rep-title{text-align:center; margin:0 0 4px; font-size:21px; font-weight:700}
.rep-site{text-align:center; font-size:15px; color:var(--gold2); margin-bottom:2px}
.rep-meta{text-align:center; font-size:13.5px; color:var(--muted); margin-bottom:14px}
.rep-sum{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:14px; margin:10px 0 14px; justify-content:center}
.signs{display:flex; gap:22px; margin-top:30px; flex-wrap:wrap}
.sign{flex:1 1 30%; min-width:170px; text-align:center; font-size:13.5px; color:var(--muted)}
.sign .line{border-top:1px dotted var(--line2); padding-top:7px; margin-top:34px}
.sign-role{margin:2px 0 1px}
.sign-in{width:100%; margin-top:8px; padding:6px 8px; font-size:13px; text-align:center}
.rep-note{font-size:12.5px; color:var(--muted); margin-top:12px}
.tl{border-left:2px solid var(--line2); margin-left:8px; padding-left:14px}
.tl .ev{position:relative; margin:12px 0}
.tl .ev::before{content:''; position:absolute; left:-21px; top:6px; width:9px; height:9px; border-radius:50%; background:var(--gold2)}
.tl .ev.fail::before{background:var(--red)} .tl .ev.srv::before{background:var(--cyan)} .tl .ev.use::before{background:var(--red)}
.tl .ev .d{font-size:13.5px; color:var(--gold2); font-weight:600}

@media print{
  .report{background:#fff !important; color:#000 !important; border:none; border-radius:0; padding:0; margin:0}
  .report .rep-site, .report .rep-title{color:#000 !important}
  .report .rep-meta, .report .rep-note, .report .hint, .report .sign{color:#333 !important}
  .report .tw{border:none; overflow:visible}
  .report table{min-width:0; font-size:12px; color:#000}
  .report th{background:#e9e9e9 !important; color:#000 !important; border:1px solid #888}
  .report td{border:1px solid #888; color:#000}
  /* สไตล์จอ tr:last-child td{border-bottom:none} แรงกว่า .report td จึงลบเส้นปิดท้ายตารางตอนพิมพ์ — ทวงคืนตรงนี้ */
  .report tr:last-child td{border-bottom:1px solid #888}
  .report tr{page-break-inside:avoid}
  .report .pill{border-color:#888 !important; color:#000 !important; background:none !important}
  .sign .line{border-top:1px solid #000}
  .report .sign-name, .report .sign-role{color:#000 !important}
  .tl{border-left-color:#999}
  .tl .ev .d{color:#000}
}

/* test panel (?test=1) */
#testout{display:none; position:fixed; inset:0; z-index:300; background:#0b1220; overflow:auto; padding:18px; font-size:14px}
#testout.on{display:block}
#testout .pass{color:#86efac} #testout .fail{color:#fca5a5}
#testout pre{white-space:pre-wrap; line-height:1.7; margin:0}
</style>
</head>

/* ============================================================
   3. DATA LAYER — load / save / migrate
   ============================================================ */
function migrate(d){
  if (!d || typeof d !== 'object') return defaultData();
  if (!d.version) d.version = 1;                       // ข้อมูลรุ่นก่อนมี version
  const base = defaultData();
  for (const k of Object.keys(base)){                  // เติม field ที่ยังไม่มีด้วยค่า default
    if (d[k] === undefined) d[k] = base[k];
  }
  for (const k of Object.keys(base.settings)){
    if (d.settings[k] === undefined) d.settings[k] = base.settings[k];
  }
  if (!d.meta || typeof d.meta !== 'object') d.meta = base.meta;
  for (const k of Object.keys(base.meta)){
    if (d.meta[k] === undefined) d.meta[k] = base.meta[k];
  }
  if (d.version < 2){                                  // v1 → v2: เพิ่มผังจุดติดตั้ง
    if (!Array.isArray(d.floorplans)) d.floorplans = [];
    d.version = 2;
  }
  if (d.version < 3){                                  // v2 → v3: รูปย้ายไปเก็บบน Google Drive
    d.inspections = listToV3(d.inspections, 'photos');
    d.issues      = listToV3(d.issues, 'closePhotos');
    d.floorplans  = (d.floorplans || []).map(p =>
      (p && p.image) ? { ...p, image: normalizePhoto(p.image) } : p);
    d.version = 3;
  }
  if (d.version < 4){                                  // v3 → v4: เพิ่มสุสาน (รายการที่ลบแล้ว)
    if (!Array.isArray(d.deleted)) d.deleted = [];
    d.version = 4;
  }
  /* v5+ ในอนาคต: เพิ่มบล็อก if (d.version < 5) {...; d.version = 5;} ตรงนี้ */
  d.version = SCHEMA_VERSION;
  return d;
}

function wipedData(prev){
  const fresh = defaultData();
  const old = (prev && typeof prev === 'object' && prev.settings && typeof prev.settings === 'object')
                ? prev.settings : {};
  for (const k of Object.keys(fresh.settings)){
    if (old[k] !== undefined) fresh.settings[k] = old[k];
  }
  fresh.settings.autoSync = false;
  return fresh;
}

function uid(prefix){
  return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}

function todayISO(d){
  const t = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate());
}

function isValidISO(s){
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y,m,d] = s.split('-').map(Number);
  if (m < 1 || m > 12 || d < 1 || d > 31) return false;
  const dt = new Date(y, m-1, d);
  return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
}

/* บวกเดือนแบบ clamp วันสิ้นเดือน: 31 ม.ค. + 1 เดือน = 28/29 ก.พ. */
function addMonths(iso, months){
  if (!isValidISO(iso)) return '';
  const n = Number(months);
  if (!Number.isFinite(n)) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const total = (y*12) + (m-1) + Math.trunc(n);
  const ny = Math.floor(total/12), nm = total%12;
  const lastDay = new Date(ny, nm+1, 0).getDate();
  const nd = Math.min(d, lastDay);
  const p = x => String(x).padStart(2,'0');
  return ny + '-' + p(nm+1) + '-' + p(nd);
}

function daysBetween(fromISO, toISO){                   // toISO - fromISO เป็นจำนวนวัน
  if (!isValidISO(fromISO) || !isValidISO(toISO)) return null;
  const a = new Date(fromISO+'T00:00:00'), b = new Date(toISO+'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function thaiDate(iso){                                  // 2026-08-23 → 23 ส.ค. 2569
  if (!isValidISO(iso)) return '—';
  const [y,m,d] = iso.split('-').map(Number);
  return d + ' ' + TH_MONTHS[m-1] + ' ' + (y + 543);
}

/* สรุปผลการตรวจ: fail แม้ข้อเดียว = ไม่ผ่านทั้งใบ */
function summarize(items){
  const v = Object.values(items || {});
  const pass = v.filter(x => x === 'pass').length;
  const fail = v.filter(x => x === 'fail').length;
  const na   = v.filter(x => x === 'na').length;
  return { pass, fail, na, total:v.length, overall: fail > 0 ? 'fail' : 'pass' };
}

function lastInspectionDate(feId, list){

/* กำหนดตรวจครั้งถัดไป = วันตรวจล่าสุด + รอบ (เดือน) */
function computeNextDue(lastDate, intervalMonths){
  if (!isValidISO(lastDate)) return '';
  const n = Number(intervalMonths);
  if (!Number.isFinite(n) || n <= 0) return '';
  return addMonths(lastDate, n);
}

/* สถานะกำหนดตรวจ: never | ok | soon | overdue */
function dueStatus(nextDue, today, warnDays){
  if (!isValidISO(nextDue)) return 'never';
  const left = daysBetween(today, nextDue);
  if (left === null) return 'never';
  if (left < 0) return 'overdue';
  return left <= Number(warnDays || 0) ? 'soon' : 'ok';
}

const DUE_LABEL = { never:'ยังไม่เคยตรวจ', ok:'ปกติ', soon:'ใกล้ครบกำหนด', overdue:'เลยกำหนด' };
const DUE_CLS   = { never:'none', ok:'ok', soon:'soon', overdue:'over' };

/* รวมข้อมูลถัง + ค่าที่คำนวณได้ (ไม่เก็บซ้ำใน record — คำนวณจาก inspections เสมอ) */
function withComputed(fe, inspList, settings, today){
  const last = lastInspectionDate(fe.id, inspList);
  const interval = Number(fe.inspectionIntervalMonths) > 0
    ? Number(fe.inspectionIntervalMonths)
    : Number(settings.defaultIntervalMonths) || 6;
  const nextDue = computeNextDue(last, interval);
  return {
    ...fe,
    _last: last,
    _interval: interval,
    _nextDue: nextDue,
    _due: dueStatus(nextDue, today, settings.warnDays),
    _daysLeft: nextDue ? daysBetween(today, nextDue) : null
  };
}

function isCodeDuplicate(code, list, exceptId){
  const c = String(code || '').trim().toLowerCase();
  if (!c) return false;
  return list.some(f => f.id !== exceptId && String(f.code||'').trim().toLowerCase() === c);
}

function validateFE(fe, list){
  const errs = [];
  if (!String(fe.code||'').trim()) errs.push('ต้องกรอกรหัสถัง');
  else if (isCodeDuplicate(fe.code, list, fe.id)) errs.push('รหัสถัง "' + fe.code.trim() + '" ซ้ำกับถังที่มีอยู่แล้ว');
  if (!String(fe.building||'').trim()) errs.push('ต้องกรอกอาคาร/พื้นที่');
  if (!AGENT_TYPES.some(a => a.id === fe.agentType)) errs.push('ต้องเลือกชนิดสารดับเพลิง');
  if (fe.sizeKg !== '' && fe.sizeKg !== null && fe.sizeKg !== undefined){
    const s = Number(fe.sizeKg);
    if (!Number.isFinite(s) || s < 0) errs.push('ขนาดบรรจุต้องเป็นตัวเลขไม่ติดลบ');
  }
  const ivRaw = fe.inspectionIntervalMonths;
  if (ivRaw !== '' && ivRaw !== null && ivRaw !== undefined){
    const iv = Number(ivRaw);
    if (!Number.isFinite(iv) || iv <= 0 || iv > 60) errs.push('รอบตรวจต้องเป็นตัวเลข 1–60 เดือน');
  }
  for (const [k,lab] of [['installDate','วันติดตั้ง'],['mfgDate','วันผลิต'],['agentExpiryDate','วันหมดอายุน้ำยา'],
                          ['lastRefillDate','วันอัดล่าสุด'],['nextRefillDate','กำหนดอัดครั้งถัดไป'],
                          ['lastHydroDate','วันทดสอบแรงดันล่าสุด'],['nextHydroDate','กำหนดทดสอบแรงดันถัดไป']]){
    if (fe[k] && !isValidISO(fe[k])) errs.push(lab + 'ไม่ถูกต้อง');
  }
  return errs;
}

function validateInspection(ins, checklist){
  const errs = [];
  if (!isValidISO(ins.date)) errs.push('วันที่ตรวจไม่ถูกต้อง');
  if (!String(ins.inspector||'').trim()) errs.push('ต้องระบุชื่อผู้ตรวจ');
  const missing = checklist.filter(it => !ins.items[it.key]);
  if (missing.length) errs.push('ยังไม่ได้ให้ผลการตรวจ ' + missing.length + ' ข้อ');
  if (ins.weightKg !== '' && ins.weightKg !== null && ins.weightKg !== undefined){
    const w = Number(ins.weightKg);
    if (!Number.isFinite(w) || w < 0) errs.push('น้ำหนักที่ชั่งต้องเป็นตัวเลขไม่ติดลบ');
  }
  return errs;
}

/* ย่อขนาดรูปให้ด้านยาวสุดไม่เกิน max (คงสัดส่วนเดิม ไม่ขยายรูปเล็ก) */
function fitSize(w, h, max){
  const W = Number(w), H = Number(h), M = Number(max);
  if (!Number.isFinite(W) || !Number.isFinite(H) || W <= 0 || H <= 0) return { w:0, h:0 };
  if (!Number.isFinite(M) || M <= 0 || (W <= M && H <= M)) return { w:Math.round(W), h:Math.round(H) };
  const r = Math.min(M / W, M / H);
  return { w: Math.max(1, Math.round(W * r)), h: Math.max(1, Math.round(H * r)) };
}

/* โหมดเดินตรวจ: เลือกถังที่จะไล่ตรวจในรอบนี้ (list ต้องผ่าน withComputed แล้ว) */
function roundList(list, building, only){
  return list.filter(fe => {
    if (fe.status === 'retired') return false;                  // ถังปลดระวางไม่ต้องเดินตรวจ
    if (building && fe.building !== building) return false;
    if (only === 'due' && !(fe._due === 'overdue' || fe._due === 'soon' || fe._due === 'never')) return false;
    return true;
  });
}

function roundProgress(round){
  const total = round && Array.isArray(round.ids) ? round.ids.length : 0;
  const done  = round && Array.isArray(round.done) ? round.done.filter(id => round.ids.includes(id)).length : 0;
  return { done, total, percent: total ? Math.round(done*100/total) : 0, left: Math.max(0, total-done) };
}

/* แปลงสิ่งที่สแกนได้ (ลิงก์ QR หรือรหัสเปล่า) → รหัสถัง */
function codeFromScan(raw){
  const s = String(raw ?? '').trim();
  if (!s) return '';
  const m = s.match(/[?&]fe=([^&#\s]+)/i);
  if (m){
    try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; }
  }
  return s;                                              // สแกนเจอข้อความเปล่า = ถือว่าเป็นรหัสถัง
}

function findByCode(code, list){
  const c = String(code || '').trim().toLowerCase();
  if (!c) return null;
  return (list || DATA.extinguishers).find(f => String(f.code||'').trim().toLowerCase() === c) || null;
}

/* กรองรายการถัง — ใช้กับ list ที่ผ่าน withComputed แล้ว */
function filterList(list, f){
  const q = String(f.q||'').trim().toLowerCase();
  return list.filter(fe => {
    if (q){
      const hay = [fe.code, fe.building, fe.zone, fe.point, fe.brand, fe.serial, agentOf(fe.agentType).name]
        .map(x => String(x||'').toLowerCase()).join(' ');
      if (!hay.includes(q)) return false;
    }
    if (f.fBuilding && fe.building !== f.fBuilding) return false;
    if (f.fAgent && fe.agentType !== f.fAgent) return false;
    if (f.fStatus && fe.status !== f.fStatus) return false;
    if (f.fDue && fe._due !== f.fDue) return false;
    return true;
  });
}

/* ดึงเลขท้ายรหัสถัง (กลุ่มตัวเลขกลุ่มสุดท้าย) — FE-BF-001 → 1, FE-10 → 10, ไม่มีเลข → null */
function codeTailNumber(code){
  const m = String(code||'').match(/(\d+)(?!.*\d)/);
  return m ? parseInt(m[1], 10) : null;
}

/* เรียงตามเลขท้ายรหัสถังจากน้อยไปมาก (FE-BF-001 → FE-PD-002 → FE-BF-003)
   เลขเท่ากันหรือรหัสไม่มีเลข ค่อยเรียงตามรหัสเต็ม (numeric:true → FE-2 มาก่อน FE-10) — รหัสไม่มีเลขไปท้ายสุด
   เดินตรวจหน้างานไล่ตามลำดับถังจริง หาง่ายกว่าเรียงตามความด่วน — ถังเลยกำหนดยังกรองดูได้ที่ชิปด้านบน */
function sortForList(list){
  return [...list].sort((a,b) => {
    const na = codeTailNumber(a.code), nb = codeTailNumber(b.code);
    if (na !== null && nb !== null && na !== nb) return na - nb;
    if (na === null && nb !== null) return 1;                    // รหัสไม่มีเลขไปอยู่ท้าย
    if (na !== null && nb === null) return -1;
    return String(a.code||'').localeCompare(String(b.code||''), 'th', { numeric:true });
  });
}

/* ============ เฟส 3: แจ้งเตือนครบกำหนด + สถิติ ============ */

/* 4 เรื่องที่ต้องเตือน — เรื่องแรกคำนวณจากประวัติตรวจ ที่เหลืออ่านจากวันที่ในทะเบียนถัง */
const ALERT_KINDS = [
  { key:'inspect', name:'ถึงรอบตรวจ',            icon:'✅', field:null },
  { key:'agent',   name:'น้ำยาหมดอายุ',           icon:'🧪', field:'agentExpiryDate' },
  { key:'refill',  name:'ครบกำหนดอัดใหม่',        icon:'🔄', field:'nextRefillDate' },
  { key:'hydro',   name:'ครบกำหนดทดสอบแรงดัน',   icon:'🧰', field:'nextHydroDate' }
];

/* เตือนของถังใบเดียว (fe ต้องผ่าน withComputed มาแล้ว) */
function alertsFor(fe, today, warnDays){
  if (!fe || fe.status === 'retired') return [];                 // ถังปลดระวางไม่ต้องเตือน
  const out = [];
  for (const k of ALERT_KINDS){
    const date = k.field ? fe[k.field] : fe._nextDue;
    if (k.field){
      if (!isValidISO(date)) continue;                           // ยังไม่ได้กรอกวันที่ = ไม่เตือน
    }else if (!isValidISO(date)){
      if (fe._due === 'never')                                   // ยังไม่เคยตรวจ = ต้องเตือนเช่นกัน
        out.push({ kind:k.key, name:k.name, icon:k.icon, feId:fe.id, code:fe.code, date:'', status:'never', daysLeft:null });
      continue;
    }
    const st = dueStatus(date, today, warnDays);
    if (st === 'overdue' || st === 'soon')
      out.push({ kind:k.key, name:k.name, icon:k.icon, feId:fe.id, code:fe.code, date, status:st, daysLeft:daysBetween(today, date) });
  }
  return out;
}

/* รวมเตือนทุกถัง เรียงด่วนสุดขึ้นก่อน */
function allAlerts(list, today, warnDays){
  const rank = { overdue:0, never:1, soon:2 };
  const out = [];
  for (const fe of list) out.push(...alertsFor(fe, today, warnDays));
  return out.sort((a,b) => {
    const r = (rank[a.status] ?? 9) - (rank[b.status] ?? 9);
    if (r !== 0) return r;
    if (a.daysLeft === null) return b.daysLeft === null ? 0 : -1;
    if (b.daysLeft === null) return 1;
    return a.daysLeft - b.daysLeft;
  });
}

function alertCounts(alerts){
  return {
    total: alerts.length,
    overdue: alerts.filter(a => a.status === 'overdue').length,
    soon: alerts.filter(a => a.status === 'soon').length,
    never: alerts.filter(a => a.status === 'never').length
  };
}

/* % ถังที่การตรวจยังไม่ขาด (ไม่นับถังปลดระวาง) */
function complianceRate(list){
  const active = list.filter(fe => fe.status !== 'retired');
  if (!active.length) return { ok:0, total:0, percent:0 };
  const ok = active.filter(fe => fe._due === 'ok' || fe._due === 'soon').length;
  return { ok, total:active.length, percent: Math.round(ok*100/active.length) };
}

/* % การตรวจที่ทำทันกำหนด — เทียบวันตรวจกับ (วันตรวจครั้งก่อน + รอบ) */
function onTimeRate(inspections, extinguishers, settings){
  const byFe = new Map();
  for (const ins of inspections || []){
    if (!byFe.has(ins.feId)) byFe.set(ins.feId, []);
    byFe.get(ins.feId).push(ins);
  }
  let onTime = 0, counted = 0;
  for (const [feId, arr] of byFe){
    const fe = (extinguishers || []).find(f => f.id === feId);
    if (!fe) continue;
    const interval = Number(fe.inspectionIntervalMonths) > 0
      ? Number(fe.inspectionIntervalMonths)
      : Number(settings.defaultIntervalMonths) || 6;
    const sorted = [...arr].filter(i => isValidISO(i.date)).sort((a,b) => a.date.localeCompare(b.date));
    for (let i=1;i<sorted.length;i++){                            // ครั้งแรกไม่มีกำหนดให้เทียบ
      const due = computeNextDue(sorted[i-1].date, interval);
      if (!due) continue;
      counted++;
      if (sorted[i].date <= due) onTime++;
    }
  }
  return { onTime, counted, percent: counted ? Math.round(onTime*100/counted) : null };
}

/* นับจำนวนตามคีย์ คืนเป็น [{key, label, n}] เรียงมากไปน้อย */
function countBy(list, keyFn, labelFn){
  const map = new Map();
  for (const item of list || []){
    const k = keyFn(item);
    if (k === undefined || k === null || k === '') continue;
    map.set(k, (map.get(k) || 0) + 1);
  }
  return [...map.entries()]
    .map(([key, n]) => ({ key, label: labelFn ? labelFn(key) : String(key), n }))
    .sort((a,b) => b.n - a.n || String(a.label).localeCompare(String(b.label), 'th'));
}

/* ข้อบกพร่องที่เจอบ่อยที่สุด n อันดับ */
function topDefects(inspections, n){
  const map = new Map();
  for (const ins of inspections || []){
    for (const [key, val] of Object.entries(ins.items || {})){
      if (val !== 'fail') continue;
      map.set(key, (map.get(key) || 0) + 1);
    }
  }
  return [...map.entries()]
    .map(([key, count]) => {
      const it = CHECKLIST.find(c => c.key === key);
      return { key, label: it ? it.label : key, count };
    })
    .sort((a,b) => b.count - a.count || a.label.localeCompare(b.label, 'th'))
    .slice(0, n || 5);
}

function summaryCounts(list){
  const c = { total:list.length, overdue:0, soon:0, ok:0, never:0, notReady:0 };
  for (const fe of list){
    c[fe._due === 'overdue' ? 'overdue' : fe._due === 'soon' ? 'soon' : fe._due === 'never' ? 'never' : 'ok']++;
    if (fe.status === 'repair' || fe.status === 'retired') c.notReady++;
  }
  return c;
}

/* ============ เฟส 4: งานแก้ไข (CAR) · บริการ · เหตุการณ์ใช้งานจริง ============ */

function issueStatusOf(id){ return ISSUE_STATUSES.find(x => x.id === id) || ISSUE_STATUSES[0]; }
function severityOf(id){ return ISSUE_SEVERITIES.find(x => x.id === id) || ISSUE_SEVERITIES[1]; }
function serviceTypeOf(id){ return SERVICE_TYPES.find(x => x.id === id) || SERVICE_TYPES[SERVICE_TYPES.length-1]; }

/* บวกวันแบบปฏิทินจริง (รับค่าติดลบได้) */
function addDays(iso, days){
  if (!isValidISO(iso)) return '';
  const n = Number(days);
  if (!Number.isFinite(n)) return '';
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + Math.trunc(n));
  return todayISO(d);
}

/* งานแก้ไข 1 ใบจากข้อที่ตรวจไม่ผ่าน */
function issueFromFail(feId, insId, itemKey, title, detail, today){
  return {
    id: uid('iss'),
    feId,
    source: 'inspection',
    inspectionId: insId || '',
    itemKey: itemKey || '',
    title: String(title || 'พบข้อบกพร่อง'),
    detail: String(detail || ''),
    severity: FAIL_SEVERITY[itemKey] || 'med',
    status: 'open',
    assignee: '',
    openedDate: isValidISO(today) ? today : '',
    dueDate: addDays(today, ISSUE_DUE_DEFAULT_DAYS),
    closedDate: '',
    closeNote: '',
    closePhotos: [],
    createdAt: new Date().toISOString()
  };
}

function issuesOf(feId, list){
  return (list || []).filter(x => x.feId === feId);
}
function openIssuesOf(feId, list){
  return issuesOf(feId, list).filter(x => x.status === 'open' || x.status === 'progress');
}
/* กันเปิดงานซ้ำ: ข้อเดิมของถังเดิมที่ยังปิดไม่ลง ไม่ต้องเปิดใบใหม่ */
function hasOpenIssueForItem(feId, itemKey, list){
  return openIssuesOf(feId, list).some(x => x.itemKey === itemKey);
}

/* งานที่ควรเปิดใหม่จากผลตรวจ 1 ใบ (ข้อที่ fail และยังไม่มีงานค้างของข้อนั้น) */
function issuesFromInspection(feId, ins, checklist, notes, existing, today){
  const out = [];
  const items = (ins && ins.items) || {};
  for (const it of checklist || []){
    if (items[it.key] !== 'fail') continue;
    if (hasOpenIssueForItem(feId, it.key, existing)) continue;
    out.push(issueFromFail(feId, ins && ins.id, it.key, it.label, (notes && notes[it.key]) || '', today));
  }
  return out;
}

function issueIsOverdue(iss, today){
  if (!iss || iss.status === 'done' || iss.status === 'cancel') return false;
  if (!isValidISO(iss.dueDate) || !isValidISO(today)) return false;
  return iss.dueDate < today;
}

function summarizeIssues(list, today){
  const l = list || [];
  const open = l.filter(x => x.status === 'open').length;
  const progress = l.filter(x => x.status === 'progress').length;
  const done = l.filter(x => x.status === 'done').length;
  const cancel = l.filter(x => x.status === 'cancel').length;
  return { total:l.length, open, progress, done, cancel, active:open+progress,
           overdue: l.filter(x => issueIsOverdue(x, today)).length };
}

/* เรียง: เลยกำหนดปิดก่อน → ยังไม่ปิด → ด่วนกว่า → กำหนดเสร็จใกล้กว่า */
function sortIssues(list, today){
  const rank = { open:0, progress:1, done:3, cancel:4 };
  const sev  = { high:0, med:1, low:2 };
  return [...(list || [])].sort((a,b) => {
    const ao = issueIsOverdue(a, today) ? 0 : 1, bo = issueIsOverdue(b, today) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    const r = (rank[a.status] ?? 9) - (rank[b.status] ?? 9);
    if (r !== 0) return r;
    const sv = (sev[a.severity] ?? 9) - (sev[b.severity] ?? 9);
    if (sv !== 0) return sv;
    return String(a.dueDate || '9999-99-99').localeCompare(String(b.dueDate || '9999-99-99'));
  });
}

function servicesOf(feId, list){
  return (list || []).filter(x => x.feId === feId)
    .sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
}
function usageOf(feId, list){
  return (list || []).filter(x => x.feId === feId)
    .sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
}

/* บันทึกบริการแล้ว ควรอัปเดตวันที่ช่องไหนในทะเบียนถังบ้าง */
function serviceFieldUpdates(srv){
  const up = {};
  if (!srv || !isValidISO(srv.date)) return up;
  const t = serviceTypeOf(srv.type);
  if (t.updates === 'refill'){
    up.lastRefillDate = srv.date;
    if (isValidISO(srv.nextDate)) up.nextRefillDate = srv.nextDate;
  }else if (t.updates === 'hydro'){
    up.lastHydroDate = srv.date;
    if (isValidISO(srv.nextDate)) up.nextHydroDate = srv.nextDate;
  }else if (t.updates === 'agent'){
    if (isValidISO(srv.nextDate)) up.agentExpiryDate = srv.nextDate;
  }
  return up;
}

/* ถังที่ถูกใช้งานจริงแล้วยังไม่ได้อัดใหม่ → คืนวันที่ใช้งานล่าสุด ถ้าไม่ค้างคืน null */
function needsRefillSince(feId, usageEvents, services){
  const uses = (usageEvents || []).filter(u => u.feId === feId && isValidISO(u.date)).map(u => u.date).sort();
  if (!uses.length) return null;
  const lastUse = uses[uses.length-1];
  const refills = (services || []).filter(s => s.feId === feId && s.type === 'refill' && isValidISO(s.date)).map(s => s.date).sort();
  const lastRefill = refills.length ? refills[refills.length-1] : '';
  return (lastRefill && lastRefill >= lastUse) ? null : lastUse;
}

/* ค่าใช้จ่ายรวมรายปี (แสดงเป็น พ.ศ.) เรียงปีใหม่ขึ้นก่อน */
function costByYear(services){
  const map = new Map();
  for (const s of services || []){
    if (!isValidISO(s.date)) continue;
    const y = Number(s.date.slice(0,4)) + 543;
    const c = Number(s.cost);
    map.set(y, (map.get(y) || 0) + (Number.isFinite(c) ? c : 0));
  }
  return [...map.entries()].map(([year, total]) => ({ year, total })).sort((a,b) => b.year - a.year);
}

/* ค่าใช้จ่ายแยกประเภทงาน ภายในปี พ.ศ. ที่ระบุ (ไม่ระบุ = ทุกปี) */
function costByType(services, buddhistYear){
  const map = new Map();
  for (const s of services || []){
    if (!isValidISO(s.date)) continue;
    if (buddhistYear && (Number(s.date.slice(0,4)) + 543) !== Number(buddhistYear)) continue;
    const c = Number(s.cost);
    map.set(s.type, (map.get(s.type) || 0) + (Number.isFinite(c) ? c : 0));
  }
  return [...map.entries()]
    .map(([key, total]) => ({ key, label: serviceTypeOf(key).name, total }))
    .sort((a,b) => b.total - a.total);
}

function money(n){
  const v = Number(n);
  if (!Number.isFinite(v)) return '0';
  return v.toLocaleString('th-TH', { maximumFractionDigits:2 });
}

/* ============ เฟส 5: รายงาน + CSV ============ */

/* --- CSV --- */
function csvCell(v){
  const s = String(v ?? '');
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/* คืนข้อความ CSV พร้อม BOM — เปิดใน Excel ไทยแล้วไม่เป็นตัวต่างดาว */
function toCSV(headers, rows){
  const head = (headers || []).map(csvCell).join(',');
  const body = (rows || []).map(r => (r || []).map(csvCell).join(',')).join('\r\n');
  return '\uFEFF' + [head, body].filter(x => x !== '').join('\r\n');
}

/* แปลงข้อความ CSV → ตาราง (รองรับ "..." ที่มีลูกน้ำ/ขึ้นบรรทัดข้างใน และ BOM) */
function parseCSV(text){
  const s = String(text ?? '').replace(/^\uFEFF/, '');
  if (!s.trim()) return [];
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (quoted){
      if (c === '"'){
        if (s[i+1] === '"'){ cell += '"'; i++; }
        else quoted = false;
      }else cell += c;
      continue;
    }
    if (c === '"'){ quoted = true; continue; }
    if (c === ','){ row.push(cell); cell = ''; continue; }
    if (c === '\r'){ continue; }
    if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; continue; }
    cell += c;
  }
  row.push(cell);
  rows.push(row);
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

/* รับวันที่ได้หลายแบบ: 2026-08-23 · 23/8/2026 · 23/8/2569 (พ.ศ.) · 23-08-2569 → คืน ISO ค.ศ. */
function parseDateInput(v){
  const s = String(v ?? '').trim();
  if (!s) return '';
  if (isValidISO(s)){
    const y = Number(s.slice(0,4));
    return y >= 2400 ? (y - 543) + s.slice(4) : s;      // 2569-08-23 = พ.ศ. → แปลงเป็น ค.ศ.
  }
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m){
    let d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
    if (y > 2200) y -= 543;                            // กรอกเป็น พ.ศ.
    const p = n => String(n).padStart(2,'0');
    const iso = y + '-' + p(mo) + '-' + p(d);
    return isValidISO(iso) ? iso : '';
  }
  const m2 = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (m2){
    let y = Number(m2[1]);
    if (y > 2200) y -= 543;
    const p = n => String(n).padStart(2,'0');
    const iso = y + '-' + p(Number(m2[2])) + '-' + p(Number(m2[3]));
    return isValidISO(iso) ? iso : '';
  }
  return '';
}

/* หา id ของชนิดสาร/สถานะ จากค่าที่พิมพ์มา (รับทั้ง id และชื่อไทย) */
function agentIdFrom(v){
  const s = String(v ?? '').trim().toLowerCase();
  if (!s) return 'dry_abc';
  const byId = AGENT_TYPES.find(a => a.id.toLowerCase() === s);
  if (byId) return byId.id;
  const byName = AGENT_TYPES.find(a => a.name.toLowerCase() === s);
  if (byName) return byName.id;
  if (/co\s?2|co₂|คาร์บอน/.test(s)) return 'co2';
  if (/\babc\b|ผงเคมี|dry/.test(s)) return 'dry_abc';
  /* จับคู่หลวมๆ เฉพาะคำยาวพอ — กัน "น้ำแข็งแห้ง" ถูกจับเป็นถัง "น้ำ" */
  const loose = AGENT_TYPES.find(a => {
    const n = a.name.toLowerCase();
    return n.length >= 4 && s.length >= 4 && (s.includes(n) || n.includes(s));
  });
  return loose ? loose.id : 'other';
}
function statusIdFrom(v){
  const s = String(v ?? '').trim().toLowerCase();
  if (!s) return 'active';
  const byId = STATUSES.find(x => x.id.toLowerCase() === s);
  if (byId) return byId.id;
  const byName = STATUSES.find(x => x.name.toLowerCase() === s);
  return byName ? byName.id : 'active';
}

/* หัวคอลัมน์ทะเบียนถัง — ใช้ทั้งตอน export และ import (จับคู่ด้วยชื่อหัว ไม่ใช่ลำดับ) */
const FE_CSV_COLS = [
  { key:'code',        head:'รหัสถัง' },
  { key:'agentType',   head:'ชนิดสารดับเพลิง' },
  { key:'sizeKg',      head:'ขนาดบรรจุ(กก.)' },
  { key:'brand',       head:'ยี่ห้อ' },
  { key:'serial',      head:'หมายเลขถัง' },
  { key:'building',    head:'อาคาร/พื้นที่' },
  { key:'zone',        head:'โซน/แผนก' },
  { key:'point',       head:'จุดติดตั้ง' },
  { key:'status',      head:'สถานะ' },
  { key:'inspectionIntervalMonths', head:'รอบตรวจ(เดือน)' },
  { key:'installDate', head:'วันติดตั้ง' },
  { key:'mfgDate',     head:'วันผลิต' },
  { key:'agentExpiryDate', head:'น้ำยาหมดอายุ' },
  { key:'lastRefillDate',  head:'อัดล่าสุด' },
  { key:'nextRefillDate',  head:'กำหนดอัดถัดไป' },
  { key:'lastHydroDate',   head:'ทดสอบแรงดันล่าสุด' },
  { key:'nextHydroDate',   head:'กำหนดทดสอบถัดไป' },
  { key:'note',        head:'หมายเหตุ' }
];
const FE_DATE_KEYS = ['installDate','mfgDate','agentExpiryDate','lastRefillDate','nextRefillDate','lastHydroDate','nextHydroDate'];

function feToCSVRow(fe){
  return FE_CSV_COLS.map(c => {
    if (c.key === 'agentType') return agentOf(fe.agentType).name;
    if (c.key === 'status')    return statusOf(fe.status).name;
    return fe[c.key] ?? '';
  });
}

function csvExtinguishers(list){
  return toCSV(
    FE_CSV_COLS.map(c => c.head).concat(['ตรวจล่าสุด','กำหนดตรวจถัดไป','สถานะกำหนด']),
    (list || []).map(fe => feToCSVRow(fe).concat([fe._last || '', fe._nextDue || '', DUE_LABEL[fe._due] || '']))
  );
}

function csvInspections(inspections, feById){

function csvServices(services, feById){
