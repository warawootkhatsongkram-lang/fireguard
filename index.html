function stampName(prefix, ext){
  const t = todayISO();
  return prefix + '-' + (Number(t.slice(0,4)) + 543) + t.slice(4) + '.' + ext;
}

function downloadFile(filename, content, mime){
  try{
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);
    return true;
  }catch(e){
    UI.lastError = 'ดาวน์โหลดไม่สำเร็จ: ' + e.message;
    toast('ดาวน์โหลดไฟล์ไม่สำเร็จ: ' + e.message, 'bad', 5000);
    return false;
  }
}

/* ---------- ส่งออกรายงานเป็นไฟล์ PDF ปุ่มเดียว (ไม่พึ่ง CDN — ทำงานตอนออฟไลน์ได้) ----------
   วิธีทำ: เรนเดอร์ <div class="report"> ใน iframe ที่ใช้ CSS ชุดเดียวกับตอนพิมพ์ (แปลง @media print → @media all)
   → วาดเป็นภาพผ่าน SVG foreignObject → ตัดเป็นหน้า A4 ตามจุดตัดที่ปลอดภัย (ไม่ตัดกลางแถว) → ประกอบเป็นไฟล์ PDF เอง
   ข้อดี: ได้ชื่อผู้ลงนามที่พิมพ์ไว้ติดไปด้วย และหน้าตาตรงกับที่พิมพ์ออกกระดาษ */
const PDF_PAGE_W = 595.28, PDF_PAGE_H = 841.89;      // A4 หน่วย point
const PDF_PX_W = 794, PDF_PX_PAD = 28;               // A4 กว้าง 794px ที่ 96dpi

function pdfDataUrlToBytes(dataUrl){
  const bin = atob(String(dataUrl).split(',')[1] || '');
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ประกอบไฟล์ PDF จากภาพ JPEG หน้าละ 1 ภาพ (เต็มหน้า A4) */
function buildPDFfromJPEGs(pages){
  const enc = new TextEncoder();
  const chunks = [];
  let len = 0;
  const push = d => { const b = (typeof d === 'string') ? enc.encode(d) : d; chunks.push(b); len += b.length; };
  const offsets = [];
  const n = pages.length;
  const pageId = i => 3 + i * 3, contentId = i => 4 + i * 3, imgId = i => 5 + i * 3;

  push('%PDF-1.4\n');
  offsets[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [' +
    pages.map((p, i) => pageId(i) + ' 0 R').join(' ') + '] /Count ' + n + ' >>\nendobj\n');

  for (let i = 0; i < n; i++){
    const content = 'q ' + PDF_PAGE_W + ' 0 0 ' + PDF_PAGE_H + ' 0 0 cm /Im0 Do Q\n';
    offsets[pageId(i)] = len;
    push(pageId(i) + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PDF_PAGE_W + ' ' + PDF_PAGE_H +
         '] /Resources << /XObject << /Im0 ' + imgId(i) + ' 0 R >> >> /Contents ' + contentId(i) + ' 0 R >>\nendobj\n');
    offsets[contentId(i)] = len;
    push(contentId(i) + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream\nendobj\n');
    offsets[imgId(i)] = len;
    push(imgId(i) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + pages[i].w + ' /Height ' + pages[i].h +
         ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + pages[i].bytes.length + ' >>\nstream\n');
    push(pages[i].bytes);
    push('\nendstream\nendobj\n');
  }

  const total = 2 + n * 3;
  const xrefPos = len;
  let xref = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
  for (let id = 1; id <= total; id++) xref += String(offsets[id] || 0).padStart(10, '0') + ' 00000 n \n';
  push(xref);
  push('trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n');

  const out = new Uint8Array(len);
  let p = 0;
  for (const c of chunks){ out.set(c, p); p += c.length; }
  return out;
}

/* จุดตัดหน้าที่ปลอดภัย = ขอบล่างของแถว/ย่อหน้า/หัวข้อ (หน่วย px นับจากขอบบนของ body ใน iframe) */
function pdfSafeBreaks(doc){
  const ys = [];
  doc.querySelectorAll('tr, h3, p, .rep-sum, .tw, .signs').forEach(el => {
    const y = el.offsetTop + el.offsetHeight;
    if (Number.isFinite(y) && y > 0) ys.push(Math.ceil(y) + PDF_PX_PAD);
  });
  return [...new Set(ys)].sort((a, b) => a - b);
}

function reportFileBase(){
  const R = UI.report || {};
  const kind = (REPORT_KINDS.find(k => k.id === R.kind) || REPORT_KINDS[0]).name;
  const range = (R.from && R.to) ? '_' + R.from + '_ถึง_' + R.to : '';
  return (kind + range).replace(/[\\/:*?"<>|]/g, '-');
}

async function exportReportPDF(){
  const rep = document.querySelector('.report');
  if (!rep){ toast('ไม่พบเนื้อรายงานในหน้านี้', 'bad'); return; }
  toast('กำลังสร้างไฟล์ PDF ...', 'good', 2500);
  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden', 'true');
  iframe.style.cssText = 'position:fixed; left:-10000px; top:0; width:' + PDF_PX_W + 'px; height:400px; border:0; opacity:0';
  document.body.appendChild(iframe);
  try{
    const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n')
                  .replace(/@media\s+print/g, '@media all');       // ใช้หน้าตาชุดเดียวกับตอนพิมพ์กระดาษ
    const doc = iframe.contentDocument;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8"><style>' + css +
              '</style><style>html,body{margin:0;padding:0;background:#fff !important}' +
              'body{padding:' + PDF_PX_PAD + 'px; width:' + (PDF_PX_W - PDF_PX_PAD * 2) + 'px}</style></head><body>' +
              rep.outerHTML + '</body></html>');
    doc.close();
    await new Promise(r => setTimeout(r, 120));                    // รอ layout เสร็จ

    const H = Math.max(1, Math.ceil(doc.body.scrollHeight) + PDF_PX_PAD);
    doc.documentElement.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    const xhtml = new XMLSerializer().serializeToString(doc.documentElement);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + PDF_PX_W + '" height="' + H + '">' +
                '<foreignObject x="0" y="0" width="' + PDF_PX_W + '" height="' + H + '">' + xhtml +
                '</foreignObject></svg>';
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();

    const scale = 2;                                               // 2 เท่า = ตัวหนังสือคมพอสำหรับสั่งพิมพ์
    const full = document.createElement('canvas');
    full.width = PDF_PX_W * scale; full.height = H * scale;
    const fx = full.getContext('2d');
    fx.fillStyle = '#fff'; fx.fillRect(0, 0, full.width, full.height);
    fx.drawImage(img, 0, 0, full.width, full.height);

    const pageH = Math.round(PDF_PX_W * (PDF_PAGE_H / PDF_PAGE_W));   // ความสูง 1 หน้า A4 หน่วย px
    const breaks = pdfSafeBreaks(doc);
    const pages = [];
    let cur = 0, guard = 0;
    while (cur < H && guard++ < 200){
      let end = Math.min(cur + pageH, H);
      if (end < H){
        const fit = breaks.filter(y => y > cur + 40 && y <= end);
        if (fit.length) end = fit[fit.length - 1];                 // ตัดที่ขอบล่างของแถวสุดท้ายที่ยังอยู่ในหน้า
      }
      const cv = document.createElement('canvas');
      cv.width = PDF_PX_W * scale; cv.height = pageH * scale;
      const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(full, 0, cur * scale, cv.width, (end - cur) * scale,
                         0, 0, cv.width, (end - cur) * scale);
      pages.push({ bytes: pdfDataUrlToBytes(cv.toDataURL('image/jpeg', 0.92)), w: cv.width, h: cv.height });
      cur = end;
    }
    if (!pages.length) throw new Error('ไม่มีเนื้อหาให้ส่งออก');

    const pdf = buildPDFfromJPEGs(pages);
    downloadFile(reportFileBase() + '.pdf', pdf, 'application/pdf');
    toast('ดาวน์โหลด PDF แล้ว ' + pages.length + ' หน้า', 'good', 4000);
  }catch(e){
    UI.lastError = 'สร้าง PDF ไม่สำเร็จ: ' + e.message;
    console.error('[FireGuard] export PDF failed', e);
    toast('สร้าง PDF ไม่สำเร็จ: ' + e.message + ' — ใช้ปุ่ม 🖨 พิมพ์ แล้วเลือกปลายทางเป็น PDF แทนได้', 'bad', 7000);
  }finally{
    try{ iframe.remove(); }catch(e){}
  }
}

function exportCSV(kind){

    const list = reportInspections(DATA.inspections, R.from, R.to, ids);
    if (!list.length){ toast('ไม่มีการตรวจในช่วงที่เลือก', 'bad'); return; }
    downloadFile(stampName('fireguard-การตรวจ','csv'), csvInspections(list, feById), 'text/csv;charset=utf-8');

  }
  if (kind === 'issues'){

    toast('ส่งออกงานแก้ไข ' + list.length + ' ใบแล้ว', 'good'); return;
  }

    const list = (DATA.services || []).filter(x => ids.includes(x.feId) && inRange(x.date, R.from, R.to))
                   .sort((a,b) => String(a.date).localeCompare(String(b.date)));

function readTextFile(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    r.onload = () => resolve(String(r.result || ''));
    r.readAsText(file, 'utf-8');
  });
}

function doImport(){
  const pv = UI.importPreview;
  if (!pv || !pv.records.length){ toast('ไม่มีข้อมูลให้นำเข้า', 'bad'); return; }
  const now = new Date().toISOString();
  let added = 0, updated = 0;
  for (const rec of pv.records){
    const clean = { ...rec };
    const mode = clean._mode, id = clean._id;
    delete clean._mode; delete clean._id;
    if (mode === 'update'){
      const i = DATA.extinguishers.findIndex(f => f.id === id);
      if (i < 0) continue;
      DATA.extinguishers[i] = { ...DATA.extinguishers[i], ...clean, updatedAt:now };
      updated++;
    }else{
      DATA.extinguishers.push({ ...clean, id: uid('fe'), createdAt:now, updatedAt:now });
      added++;
    }
  }
  UI.importPreview = null;
  save();
  closeModal();
  UI.view = 'list';
  toast('นำเข้าแล้ว — เพิ่ม ' + added + ' ใบ · อัปเดต ' + updated + ' ใบ', 'good', 4000);
  render();
  warnIfStorageHeavy();
}

let syncing = false;
let autoSyncTimer = null;
let photoMigrating = false;                     // กันกดปุ่มย้ายรูปซ้ำระหว่างที่ยังอัปไม่เสร็จ

function setSyncStatus(msg){
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg;
}

async function gasCall(action, extra){
  const url = String(DATA.settings.gasUrl || '').trim();
  if (!isValidGasUrl(url)) throw new Error('ยังไม่ได้ตั้งลิงก์ Web App หรือลิงก์ไม่ถูกต้อง');
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), SYNC_TIMEOUT_MS) : null;
  try{
    /* ไม่ใส่ Content-Type โดยตั้งใจ — ใส่แล้วจะโดน CORS preflight ที่ GAS ไม่ตอบ */
    const res = await fetch(url, {
      method:'POST',
      body: JSON.stringify({ ...syncPayload(action, DATA, DATA.settings.syncToken), ...(extra || {}) }),
      redirect:'follow',
      signal: ctrl ? ctrl.signal : undefined
    });
    const text = await res.text();
    const parsed = parseSyncResponse(text);
    if (!parsed.ok) throw new Error(parsed.error);
    return parsed.data;
  }catch(e){
    if (e && e.name === 'AbortError') throw new Error('เชื่อมต่อนานเกิน ' + Math.round(SYNC_TIMEOUT_MS/1000) + ' วินาที — เน็ตช้าหรือลิงก์ไม่ถูกต้อง');
    throw e;
  }finally{
    if (timer) clearTimeout(timer);
  }
}

/* ---------- อัปรูปที่ค้างอยู่ในเครื่องขึ้น Drive ---------- */

/* อัปรูป 1 ใบ แล้วเขียนผลกลับเข้าที่เดิม — สำเร็จแล้วทิ้งรูปเต็มในเครื่อง เหลือแค่รูปย่อ
   คืนข้อความเตือนจากฝั่ง Drive (ถ้ามี) เช่นตั้งสิทธิ์แชร์ไม่ผ่าน */
async function uploadOnePhoto(job){
  const p = job.photo;
  const full = String(p.full || '');
  if (!full) throw new Error('รูปนี้ไม่มีข้อมูลรูปในเครื่องแล้ว');
  const name = photoFileName(job.code, job.kind, job.date, job.index < 0 ? 0 : job.index);
  const r = await gasCall('uploadPhoto', {
    photo: {
      dataB64: full.split('base64,').pop(),
      mimeType: (full.match(/^data:([^;]+);/) || [null, 'image/jpeg'])[1],
      name,
      date: isValidISO(job.date) ? job.date : todayISO()
    }
  });
  if (!r || !r.id) throw new Error('อัปโหลดแล้วแต่ไม่ได้รหัสไฟล์กลับมา');

  let thumb = p.thumb;
  if (!thumb){
    try{ thumb = await shrinkDataUrl(full, THUMB_MAX_PX, THUMB_QUALITY); }
    catch(e){ thumb = ''; console.error('[FireGuard] ทำรูปย่อไม่สำเร็จ', e); }
  }
  const done = { uid:p.uid, id:r.id, name:r.name || name, thumb, full:'', pending:false };

  if (job.key === 'image'){                       // รูปผังจุดติดตั้ง (มีรูปเดียวต่อผัง)
    job.rec.image = done;
  }else{
    const list = normalizePhotoList(job.rec[job.key]);
    const i = list.findIndex(x => x.uid === p.uid);
    if (i >= 0) list[i] = done; else list.push(done);
    job.rec[job.key] = list;
  }
  return r.warn || '';
}

/* ทยอยอัปรูปค้างทีละชุด — ล้มกลางทางก็ไม่เป็นไร รูปที่เหลือยังอยู่ในเครื่อง ค่อยอัปรอบหน้า */
async function uploadPendingPhotos(limit){
  if (!isValidGasUrl(DATA.settings.gasUrl)){
    return { done:0, failed:0, left:pendingPhotoCount(DATA), warn:'', err:'ยังไม่ได้ตั้งลิงก์ Web App' };
  }
  const jobs = collectPendingPhotos(DATA).slice(0, limit || UPLOAD_BATCH);
  let done = 0, failed = 0, warn = '', err = '';
  for (const job of jobs){
    try{
      const w = await uploadOnePhoto(job);
      if (w && !warn) warn = w;
      done++;
      setSyncStatus('⏳ กำลังอัปรูปขึ้น Drive ' + done + '/' + jobs.length + '…');
    }catch(e){
      failed++;
      err = e.message;
      UI.lastError = 'อัปรูปขึ้น Drive ไม่สำเร็จ: ' + e.message;
      console.error('[FireGuard] upload photo failed', e);
      break;                                      // ล้มหนึ่งใบมักแปลว่าเน็ตหลุดหรือสิทธิ์ไม่ผ่าน — ยิงต่อเสียเวลาเปล่า
    }
  }
  if (done) save();
  return { done, failed, left: pendingPhotoCount(DATA), warn, err };
}

/* ปุ่ม "ย้ายรูปเก่าขึ้น Drive" ในหน้าตั้งค่า — วนอัปจนหมดหรือจนกว่าจะติดปัญหา */
async function migratePhotosNow(){
  if (photoMigrating) return;
  const total = pendingPhotoCount(DATA);
  if (!total){ toast('ไม่มีรูปค้าง รูปทุกใบขึ้น Drive แล้ว', 'good', 3200); return; }
  photoMigrating = true;
  render();
  let done = 0, warn = '', err = '';
  try{
    while (true){
      const r = await uploadPendingPhotos(UPLOAD_BATCH);
      done += r.done;
      if (r.warn && !warn) warn = r.warn;
      if (r.err){ err = r.err; break; }
      if (!r.left || !r.done) break;               // หมดแล้ว หรือรอบนี้อัปไม่ขึ้นเลย = หยุด ไม่วนไม่รู้จบ
    }
  }finally{
    photoMigrating = false;
  }
  const left = pendingPhotoCount(DATA);
  setSyncStatus(left ? ('อัปแล้ว ' + done + ' รูป · ยังค้าง ' + left + ' รูป') : ('✓ อัปรูปขึ้น Drive ครบแล้ว ' + done + ' รูป'));
  if (err) toast('อัปได้ ' + done + ' รูป แล้วติดปัญหา: ' + err, 'bad', 7000);
  else if (warn) toast('อัปครบ ' + done + ' รูป แต่มีข้อควรระวัง: ' + warn, 'bad', 8000);
  else toast('ย้ายรูปขึ้น Drive แล้ว ' + done + ' รูป', 'good', 4000);
  render();
}

function markSync(status, note){
  DATA.meta = { ...(DATA.meta||{}), lastSyncAt:new Date().toISOString(), lastSyncStatus:status, lastSyncNote:note || '' };
  save();
  setSyncStatus(syncStatusText(DATA.meta));
}

/* ซิงก์ = ดึงของบนคลาวด์มารวมก่อน แล้วค่อยส่งของทั้งหมดขึ้นไป (กันข้อมูลของเครื่องอื่นหาย) */
async function syncNow(silent){
  if (syncing) return;
  if (!isValidGasUrl(DATA.settings.gasUrl)){
    if (!silent) toast('ยังไม่ได้ตั้งลิงก์ Web App ที่หน้าตั้งค่า', 'bad', 4000);
    return;
  }
  syncing = true;
  setSyncStatus('⏳ กำลังซิงก์…');
  if (!silent) toast('กำลังซิงก์…', '', 1500);
  try{
    const remote = await gasCall('pull');
    const merged = mergeAll(DATA, remote || {});
    const sum = syncStatSummary(merged.stat);
    DATA = { ...DATA, ...merged.data };
    if (Array.isArray(remote && remote.inspectors)){
      for (const n of remote.inspectors) if (n && !DATA.inspectors.includes(n)) DATA.inspectors.push(n);
    }
    save();
    const up = await uploadPendingPhotos();      // อัปรูปที่ค้างก่อน แล้วค่อย push — รหัสรูปบน Drive จะได้ขึ้นไปพร้อมข้อมูล
    await gasCall('push');
    const note = (sum.added || sum.updated ? ('รับมาใหม่ ' + sum.added + ' · อัปเดต ' + sum.updated) : 'ข้อมูลตรงกันทั้งสองฝั่ง')
               + (merged.removed ? ' · ลบตามเครื่องอื่น ' + merged.removed : '')
               + (up.done ? ' · อัปรูป ' + up.done + ' ใบ' : '')
               + (up.left ? ' · รูปค้างอีก ' + up.left + ' ใบ' : '');
    markSync('ok', note);
    if (!silent) toast('ซิงก์สำเร็จ — ' + note, 'good', 3600);
    if (!silent && up.warn) toast(up.warn, 'bad', 8000);
    render();
  }catch(e){
    UI.lastError = 'ซิงก์ไม่สำเร็จ: ' + e.message;
    markSync('fail', e.message);
    if (!silent) toast('ซิงก์ไม่สำเร็จ: ' + e.message, 'bad', 6000);
    console.error('[FireGuard] sync failed', e);
  }finally{
    syncing = false;
  }
}

async function syncPing(){
  setSyncStatus('⏳ กำลังทดสอบการเชื่อมต่อ…');
  try{
    const r = await gasCall('ping');

    setSyncStatus('✓ เชื่อมต่อได้' + sheet);

  }catch(e){
    UI.lastError = 'ทดสอบเชื่อมต่อไม่ผ่าน: ' + e.message;
    setSyncStatus('✗ เชื่อมต่อไม่ได้ — ' + e.message);
    toast('เชื่อมต่อไม่ได้: ' + e.message, 'bad', 6000);
  }
}

/* ---------- event delegation ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  if (act === 'maskClose'){ if (e.target === t) closeModal(); return; }
  if (act === 'closeModal'){ closeModal(); return; }

  switch(act){
    case 'tab':
      UI.view = t.dataset.tab; UI.inspectDraft = null;
      render(); window.scrollTo(0,0); break;
    case 'open':
      UI.feId = t.dataset.id; UI.view = 'detail';
      render(); window.scrollTo(0,0); break;
    case 'newFE':
      openModal(feFormHTML({ agentType:'dry_abc', status:'active' })); break;
    case 'editFE': {
      const fe = DATA.extinguishers.find(f => f.id === t.dataset.id);
      if (fe) openModal(feFormHTML(fe));
      break;
    }
    case 'saveFE':      saveFE(t.dataset.id || ''); break;
    case 'askDeleteFE': askDeleteFE(t.dataset.id); break;
    case 'doDeleteFE':  doDeleteFE(t.dataset.id); break;
    case 'startInspect':startInspect(t.dataset.id); break;
    case 'editInspection':      editInspection(t.dataset.id); break;
    case 'askDeleteInspection': askDeleteInspection(t.dataset.id); break;
    case 'doDeleteInspection':  doDeleteInspection(t.dataset.id); break;
    case 'repPickAll':               repPickAll(); break;
    case 'repBulkEdit':              askBulkEditInspections(); break;
    case 'doBulkEditInspections':    doBulkEditInspections(); break;
    case 'repBulkDelete':            askBulkDeleteInspections(); break;
    case 'doBulkDeleteInspections':  doBulkDeleteInspections(); break;
    case 'cancelInspect':
      UI.inspectDraft = null;
      UI.view = UI.round ? 'round' : 'detail';
      render(); break;
    case 'saveInspect': saveInspection(); break;
    case 'allPass': {
      const d = UI.inspectDraft; if (!d) break;
      const fe = DATA.extinguishers.find(f => f.id === d.feId);
      for (const it of activeChecklist(fe.agentType, d.type)) d.items[it.key] = 'pass';
      render(); break;
    }
    case 'clearItems':
      if (UI.inspectDraft){ UI.inspectDraft.items = {}; UI.inspectDraft.notes = {}; render(); }
      break;
    case 'filterDue':
      UI.fDue = t.dataset.due || ''; render(); break;
    case 'alertKind':
      UI.alertKind = t.dataset.kind || ''; render(); break;
    case 'addInspector': {
      const el = document.getElementById('newInspector');
      const name = el ? el.value.trim() : '';
      if (!name){ toast('กรอกชื่อก่อน', 'bad'); break; }
      if (DATA.inspectors.includes(name)){ toast('มีชื่อนี้แล้ว', 'bad'); break; }
      DATA.inspectors.push(name); save(); render(); toast('เพิ่มผู้ตรวจแล้ว', 'good'); break;
    }
    case 'delInspector':
      DATA.inspectors = DATA.inspectors.filter(n => n !== t.dataset.name);
      save(); render(); break;

    /* ----- QR / แท็ก ----- */
    case 'showQR': {
      const fe = DATA.extinguishers.find(f => f.id === t.dataset.id);
      if (fe) openModal(qrModalHTML(fe));
      break;
    }
    case 'qrOneToSheet':
      UI.qrPick = [t.dataset.id];
      closeModal(); UI.view = 'qrsheet'; render(); window.scrollTo(0,0); break;
    case 'qrPickAll':
      UI.qrPick = DATA.extinguishers.map(f => f.id); render(); break;
    case 'qrPickNone':
      UI.qrPick = []; render(); break;
    case 'printSheet':
      if (!UI.qrPick.length){ toast('เลือกถังที่จะพิมพ์ก่อน', 'bad'); break; }

    /* ----- สแกน QR ----- */

      DATA.services = DATA.services.filter(x => x.id !== t.dataset.id);

/* input / change — ฟอร์มที่พิมพ์แล้วอัปเดต state ทันที */
document.addEventListener('input', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  if (act === 'search'){
    UI.q = t.value;
    const pos = t.selectionStart;
    render();
    const box = document.getElementById('q');
    if (box){ box.focus(); box.setSelectionRange(pos, pos); }
    return;
  }
  if (act === 'draft' && UI.inspectDraft){
    UI.inspectDraft[t.dataset.key] = t.value;
    if (t.dataset.key === 'type') render();               // เปลี่ยนรอบ = เช็คลิสต์เปลี่ยน
    renderDebug();
    return;
  }
  if (act === 'itemNote' && UI.inspectDraft){
    UI.inspectDraft.notes[t.dataset.key] = t.value;
    renderDebug();
    return;
  }
  if (act === 'signName'){                                 // ชื่อผู้ลงนามท้ายรายงาน — อัปเดตสดโดยไม่ re-render (กัน focus หลุด)
    const key = t.dataset.key;
    DATA.settings[key] = t.value;
    save();
    const box = document.querySelector('.sign-name[data-name="' + key + '"]');
    if (box) box.textContent = t.value.trim() || SIGN_BLANK;
    renderDebug();
    return;
  }
  if (act === 'set'){
    DATA.settings[t.dataset.key] = (t.dataset.key === 'siteName') ? t.value : t.value;
    save();
    $('#siteName').innerHTML = '<span class="co">' + esc(COMPANY) + '</span>' + esc(DATA.settings.siteName) + '<br><span style="opacity:.65">ถังทั้งหมด ' + DATA.extinguishers.length + ' ใบ</span>';
    renderDebug();
    return;
  }
});

document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'filter'){ UI[t.dataset.key] = t.value; render(); return; }
  if (act === 'qrPick'){
    const id = t.dataset.id;
    UI.qrPick = t.checked ? [...new Set([...UI.qrPick, id])] : UI.qrPick.filter(x => x !== id);
    render();
    return;
  }
  if (act === 'qrSize'){ UI.qrSize = t.value; render(); return; }
  if (act === 'repPick'){                                   // ติ๊กเลือกผลตรวจในตารางรายงาน
    const id = t.dataset.id;
    UI.repPick = t.checked ? [...new Set([...UI.repPick, id])] : UI.repPick.filter(x => x !== id);
    render();
    return;
  }
  if (act === 'setBool'){
    DATA.settings[t.dataset.key] = !!t.checked;
    save();
    render();
    if (t.dataset.key === 'autoSync' && t.checked) toast('เปิดซิงก์อัตโนมัติแล้ว', 'good');
    return;
  }
  if (act === 'addPhoto'){ addPhotoFromInput(t); return; }
  if (act === 'addFormPhoto'){ addFormPhotoFromInput(t); return; }
  if (act === 'restoreFile'){ restoreFromFile(t); return; }
  if (act === 'importFile'){ importCSVFile(t); return; }
  if (act === 'rep'){
    if (!UI.report) UI.report = Object.assign({ kind:'inspect', building:'', feId:'' }, defaultReportRange(todayISO()));
    UI.report[t.dataset.key] = t.value;
    render();
    return;
  }
  if (act === 'fdRender'){ syncFormDOM(); renderForm(); return; }
  if (act === 'item' && UI.inspectDraft){
    UI.inspectDraft.items[t.dataset.key] = t.value;
    if (t.value !== 'fail') delete UI.inspectDraft.notes[t.dataset.key];
    render();
    return;
  }
  if (act === 'draft' && UI.inspectDraft && (t.type === 'date' || t.tagName === 'SELECT')){
    UI.inspectDraft[t.dataset.key] = t.value;
    render();
    return;
  }
});

function init(){
  load();
  const p = new URLSearchParams(location.search);
  if (p.get('debug') === '1') document.getElementById('debug').classList.add('on');
  if (p.get('test')) { runTests(); return; }
  const feCode = p.get('fe');                              // เตรียมไว้ให้ QR เฟส 2 (?fe=FE-001)
  if (feCode){
    const fe = DATA.extinguishers.find(f => String(f.code).toLowerCase() === feCode.toLowerCase());
    if (fe){ UI.feId = fe.id; UI.view = 'detail'; }
    else setTimeout(() => toast('ไม่พบถังรหัส ' + feCode + ' ในระบบ', 'bad', 4000), 300);
  }
  render();
  /* เฟส 6: เปิดแอปแล้วดึงข้อมูลจากคลาวด์มารวมให้เอง (เฉพาะเมื่อเปิดซิงก์อัตโนมัติไว้) */
  if (DATA.settings.autoSync && isValidGasUrl(DATA.settings.gasUrl))
    setTimeout(() => syncNow(true), 1200);
}

/* ---------- test suite (?test=1) ---------- */
const tests = [];
function test(name, fn){ tests.push({ name, fn }); }
function assertEq(a, b, msg){
  if (JSON.stringify(a) !== JSON.stringify(b))
    throw new Error((msg ? msg + ' — ' : '') + JSON.stringify(a) + ' != ' + JSON.stringify(b));
}
function assertTrue(v, msg){ if (!v) throw new Error(msg || 'expected true'); }

function runTests(){
  const out = [];
  let pass = 0, fail = 0;
  for (const t of tests){
    try{ t.fn(); pass++; out.push('<span class="pass">✔ PASS</span>  ' + t.name); }
    catch(e){ fail++; out.push('<span class="fail">✘ FAIL</span>  ' + t.name + '\n         ↳ ' + e.message); }
  }
  document.getElementById('testout').classList.add('on');
  document.getElementById('testBody').innerHTML =
    `<b>FireGuard test suite</b> — ทั้งหมด ${tests.length} · ` +
    `<span class="pass">ผ่าน ${pass}</span> · <span class="${fail?'fail':'pass'}">ไม่ผ่าน ${fail}</span>\n` +
    `<span style="color:#64748b">(เอา ?test=1 ออกจาก URL เพื่อกลับไปหน้าแอป)</span>\n\n` + out.join('\n');
  console.log('[FireGuard] tests: ' + pass + '/' + tests.length + ' passed');
}
